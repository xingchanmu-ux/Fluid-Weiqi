name: Acquire activation file
on:
  workflow_dispatch: {}
jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Download Unity Editor
        run: |
          echo "Downloading Unity 2022.3.62f3 for Linux..."
          curl -sL -o Unity.tar.xz "https://download.unity3d.com/download_unity/96770f904ca7/LinuxEditorInstaller/Unity.tar.xz"
          echo "Extracting..."
          tar -xf Unity.tar.xz
          ls -la Editor/Unity

      - name: Generate activation file
        run: |
          echo "Running Unity to generate .alf..."
          ./Editor/Unity -batchmode -quit -createManualActivationFile -nographics 2>&1 || true
          echo "=== Searching for .alf files ==="
          find . -name "*.alf" -type f 2>/dev/null
          ls -la *.alf 2>/dev/null || echo "No .alf in root"

      - name: Upload .alf artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v2022.3.62f3.alf
          path: "**/*.alf"
          if-no-files-found: error
